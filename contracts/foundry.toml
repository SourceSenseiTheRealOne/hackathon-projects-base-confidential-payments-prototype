[profile.default]
src = "src"
test = "test"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=node_modules/forge-std/src/", "ds-test/=node_modules/ds-test/src/", "@inco/=node_modules/@inco/", "@openzeppelin/=node_modules/@openzeppelin/", "safe-smart-account/=node_modules/@safe-global/safe-smart-account/contracts/"]
